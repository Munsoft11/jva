<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Julio Visual Arts</title>
  <meta name="description" content="A curated gallery of wedding, portrait, family, event and editorial photography from Julio Visual Arts.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="gallery">

  <div id="jva-navbar"></div>

  <main>

    <header class="jva-page-head">
      <div class="container">
        <span class="jva-eyebrow"><i class="bi bi-images"></i> Gallery</span>
        <h1 class="jva-page-head__title">Moments we've been trusted with.</h1>
        <p class="jva-page-head__lead">
          A small selection from recent sessions. Use the filters to explore by category —
          and remember, every one of these started with a simple hello.
        </p>
      </div>
    </header>

    <section class="jva-section jva-section--white">
      <div class="container">
        <div class="jva-filter reveal" id="jvaGalleryFilter">
          <button class="jva-filter__btn is-active" data-filter="all">All</button>
          <button class="jva-filter__btn" data-filter="photography">Photography</button>
          <button class="jva-filter__btn" data-filter="videography">Videography</button>
          <button class="jva-filter__btn" data-filter="decoration">Decoration</button>
        </div>

        <div class="row g-3" id="jvaGalleryGrid"></div>
      </div>
    </section>

    <section class="jva-section jva-section--peach">
      <div class="container text-center reveal">
        <h2 class="jva-section__title">Like what you see?</h2>
        <p class="jva-section__lead mx-auto">Let's create something just as beautiful for you.</p>
        <a href="booking.html" class="btn btn-jva btn-lg mt-3">Book a Session</a>
      </div>
    </section>

  </main>

  <div id="jva-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
